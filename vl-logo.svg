    <rect x="5" y="88" width="390" height="4" rx="2" fill="url(#blue)"/>
    <text x="5" y="132" fill="#61D6FF" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4">WEB DEVELOPER</text>
  </g>
